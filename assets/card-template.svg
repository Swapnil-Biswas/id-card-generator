<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="90" height="39" patternUnits="userSpaceOnUse">
      <path d="M 90 0 L 0 0 0 39" fill="none" stroke="#F4C93B" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94F8C"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>

    <style>
      .watermark { font-family: monospace; font-size: 11px; fill: #F4C93B; fill-opacity: 0.08; }
      .credit-txt { font-family: monospace; font-size: 10px; fill: #A8C9B0; letter-spacing: 2px; }
      .badge-b { font-family: monospace; font-size: 10px; font-weight: 700; fill: #1E3D2B; }
      .badge-span { font-family: monospace; font-size: 7px; fill: #4A3F1A; letter-spacing: 0.5px; }
      .head-h1 { font-family: sans-serif; font-size: 52px; font-weight: 900; fill: #F4C93B; letter-spacing: 1px; }
      .head-goa { font-family: sans-serif; font-size: 20px; font-weight: 900; fill: #F4C93B; letter-spacing: 2px; }
      .head-years { font-family: monospace; font-size: 14px; font-weight: 700; fill: #F2EDE0; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Card Background (#1e3d2b) -->
  <rect width="420" height="720" fill="#1E3D2B"/>
  <rect width="420" height="720" fill="url(#grid)"/>

  <!-- Repeating Background Watermark Text -->
  <text x="20" y="32" class="watermark">HACKER HOUSE GOA 2026 BUILD SHIP LAUNCH</text>
  <text x="20" y="48" class="watermark">28 31 OCT GOA INDIA HACKER HOUSE GOA</text>
  <text x="20" y="64" class="watermark">BUILD SHIP LAUNCH HACKER HOUSE GOA 2026</text>

  <!-- Card Border (3px solid #f4c93b) -->
  <rect x="1.5" y="1.5" width="417" height="717" rx="26" fill="none" stroke="#F4C93B" stroke-width="3"/>

  <!-- Top Credit -->
  <text x="210" y="24" class="credit-txt" text-anchor="middle">HACKER HOUSE GOA · BUILDER ID</text>

  <!-- Badge Top Left -->
  <g transform="translate(24, 40)">
    <rect width="145" height="28" rx="14" fill="#F4C93B"/>
    <circle cx="14" cy="14" r="11" fill="#D94F8C"/>
    <text x="14" y="18" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900">H</text>
    <text x="32" y="14" class="badge-b">2:47 PM Studio</text>
    <text x="32" y="23" class="badge-span">HACKER HOUSE GOA</text>
  </g>

  <!-- Concentric Target Rings Top Right -->
  <g transform="translate(390, 190)" opacity="0.9">
    <circle cx="0" cy="0" r="120" fill="none" stroke="#F4C93B" stroke-width="18"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#D94F8C" stroke-width="14"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#F4C93B" stroke-width="10"/>
  </g>

  <!-- Heading Section -->
  <g transform="translate(26, 142)">
    <text x="0" y="0" class="head-h1">HACKER</text>
    <text x="0" y="44" class="head-h1">HOUSE</text>

    <!-- Pink Goa Badge -->
    <g transform="translate(195, 20) rotate(-2)">
      <rect width="72" height="26" rx="6" fill="#D94F8C"/>
      <text x="36" y="19" class="head-goa" text-anchor="middle">गोवा</text>
    </g>

    <!-- Years & Underline -->
    <text x="0" y="78" class="head-years">GOA, INDIA · 28–31 OCT 2026</text>
    <line x1="0" y1="84" x2="275" y2="84" stroke="#F4C93B" stroke-width="2"/>
  </g>
</svg>
