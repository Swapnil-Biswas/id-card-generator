<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#F4C93B" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D94F8C"/>
      <stop offset="100%" stop-color="#FF2A85"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="420" height="720" fill="#062C1B"/>
  <rect width="420" height="720" fill="url(#grid)"/>

  <!-- Outer Border Frame -->
  <rect x="10" y="10" width="400" height="700" fill="none" stroke="#F4C93B" stroke-width="1.5" stroke-opacity="0.25"/>
  <rect x="14" y="14" width="392" height="692" fill="none" stroke="#F4C93B" stroke-width="0.5" stroke-dasharray="4 4" stroke-opacity="0.2"/>

  <!-- Top-Right Concentric Arches (Reference Style) -->
  <g stroke="#F4C93B" stroke-width="12" fill="none" opacity="0.25" transform="translate(360, 20)">
    <circle cx="60" cy="40" r="110"/>
    <circle cx="60" cy="40" r="80" stroke="#D94F8C"/>
    <circle cx="60" cy="40" r="50"/>
  </g>

  <!-- Center Concentric Target Rings Behind Photo Cutout -->
  <g stroke="#F4C93B" fill="none" transform="translate(210, 360)">
    <circle cx="0" cy="0" r="165" stroke-width="18" stroke-opacity="0.12"/>
    <circle cx="0" cy="0" r="125" stroke-width="14" stroke-opacity="0.16"/>
    <circle cx="0" cy="0" r="85" stroke-width="10" stroke="#D94F8C" stroke-opacity="0.22"/>
    <circle cx="0" cy="0" r="45" stroke-width="6" stroke-opacity="0.25"/>
  </g>

  <!-- Top Header Bar -->
  <text x="24" y="30" fill="#8EB89B" font-family="'Space Mono', monospace" font-size="8.5" letter-spacing="2">HACKER HOUSE GOA · BUILDER PASS</text>
  <text x="396" y="30" fill="#F4C93B" font-family="'Space Mono', monospace" font-size="8.5" letter-spacing="1" text-anchor="end">2026</text>
  <line x1="24" y1="36" x2="396" y2="36" stroke="#F4C93B" stroke-width="1" stroke-opacity="0.3"/>

  <!-- 2:47 PM STUDIO Badge -->
  <g transform="translate(24, 44)">
    <rect width="130" height="20" rx="10" fill="#F4C93B"/>
    <circle cx="11" cy="10" r="6.5" fill="#062C1B"/>
    <text x="11" y="13" fill="#F4C93B" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="7.5" font-weight="900">247</text>
    <text x="25" y="13" fill="#062C1B" font-family="'Space Mono', monospace" font-size="8" font-weight="700" letter-spacing="0.5">2:47 PM STUDIO</text>
  </g>

  <!-- Top Stacked Header (Reference Style: TEAM / CREATIVE / HACKER / HOUSE) -->
  <g transform="translate(24, 72)">
    <text y="34" fill="#F4C93B" font-family="Impact, 'Arial Black', sans-serif" font-size="38" letter-spacing="1.5">HACKER</text>
    <text y="70" fill="#F4C93B" font-family="Impact, 'Arial Black', sans-serif" font-size="38" letter-spacing="1.5">HOUSE</text>
    
    <!-- Pink Goa Badge -->
    <g transform="translate(190, 42) rotate(-3)">
      <rect width="74" height="25" rx="6" fill="url(#pink-grad)"/>
      <text x="37" y="17.5" fill="#F4C93B" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="16" letter-spacing="1.5">गोवा</text>
    </g>

    <text y="92" fill="#F4F1EA" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">GOA, INDIA · 28–31 OCT 2026</text>
    <line x1="0" y1="100" x2="372" y2="100" stroke="#F4C93B" stroke-width="1.5"/>
  </g>
</svg>
