<svg xmlns="http://www.w3.org/2000/svg" width="420" height="720" viewBox="0 0 420 720">
  <defs>
    <!-- Slanted Clip Path for Bottom Name Card Banner (clip-path: polygon(0 22%, 100% 0%, 100% 100%, 0% 100%)) -->
    <clipPath id="slanted-banner-clip">
      <polygon points="-20,550 440,510 440,740 -20,740"/>
    </clipPath>
    <pattern id="banner-grid" width="420" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0 19.5 H 420" stroke="#F4C93B" stroke-opacity="0.04"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap');
      .strip-watermark { font-family: 'Space Mono', monospace; font-size: 10px; fill: #1E3D2B; fill-opacity: 0.08; }
      .strip-label { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; fill: #4A3F1A; letter-spacing: 3px; }
    </style>
  </defs>

  <!-- Slanted Name Card Banner Group -->
  <g clip-path="url(#slanted-banner-clip)">
    <!-- Sun Gold Banner Fill (#f4c93b) -->
    <rect x="-20" y="500" width="460" height="240" fill="#F4C93B"/>
    <rect x="-20" y="500" width="460" height="240" fill="url(#banner-grid)"/>

    <!-- Watermark Text Inside Banner -->
    <text x="26" y="555" class="strip-watermark">HACKER HOUSE GOA BUILD SHIP LAUNCH GOA INDIA OCT 2026</text>
    <text x="26" y="570" class="strip-watermark">HACKER HOUSE GOA BUILD SHIP LAUNCH GOA INDIA 2026</text>
  </g>

  <!-- Deco Line Above Text -->
  <line x1="26" y1="592" x2="394" y2="592" stroke="#1E3D2B" stroke-width="2" stroke-opacity="0.5"/>
  <text x="26" y="605" class="strip-label">OFFICIAL BUILDER ID CARD</text>
</svg>
